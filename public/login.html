<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Watchsave Login</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="auth">
    <div class="auth-card">
      <a class="logo" href="./index.html">WATCH<span>SAVE</span></a>

      <div class="eyebrow">WELCOME BACK</div>

      <h1>Ready to watch?</h1>
      <p>Log in to your account.</p>

      <form id="f">
        <label>
          Email
          <input id="e" type="email" required />
        </label>

        <label>
          Password
          <input id="p" type="password" required />
        </label>

        <button class="primary">Log in</button>
      </form>

      <div class="switch">
        New here?
        <a href="./register.html">Create an account</a>
      </div>

      <div id="err" class="error"></div>
    </div>

    <script>
      const form = document.getElementById("f");
      const email = document.getElementById("e");
      const password = document.getElementById("p");
      const error = document.getElementById("err");

      form.onsubmit = async (x) => {
        x.preventDefault();
        error.textContent = "";

        try {
          const r = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email.value,
              password: password.value
            })
          });

          const d = await r.json();

          if (!r.ok) {
            throw new Error(d.error || "Login failed");
          }

          location.href = "./index.html";

        } catch (q) {
          error.textContent = q.message;
        }
      };
    </script>
  </body>
</html>
