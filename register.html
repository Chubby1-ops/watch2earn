<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>Join Watchsave</title>
    <link rel="stylesheet" href="/public/css/style.css" />
  </head>

  <body class="auth">
    <div class="auth-card">
      <a class="logo" href="index.html">
        WATCH<span>SAVE</span>
      </a>

      <div class="eyebrow">JOIN WATCHSAVE</div>

      <h1>Create your account.</h1>

      <form id="f">
        <label>
          Name
          <input id="n" required />
        </label>

        <label>
          Email
          <input id="e" type="email" required />
        </label>

        <label>
          Phone <small>(optional)</small>
          <input id="ph" />
        </label>

        <label>
          Password
          <input
            id="p"
            type="password"
            minlength="6"
            required
          />
        </label>

        <button class="primary" type="submit">
          Create account
        </button>
      </form>

      <div class="switch">
        Already registered?
        <a href="login.html">Log in</a>
      </div>

      <div id="err" class="error"></div>
    </div>

    <script>
      const BACKEND_URL =
        "https://watch2earn-d9im.onrender.com";

      const form =
        document.getElementById("f");

      const nameInput =
        document.getElementById("n");

      const emailInput =
        document.getElementById("e");

      const phoneInput =
        document.getElementById("ph");

      const passwordInput =
        document.getElementById("p");

      const error =
        document.getElementById("err");

      /*
        Capture referral code from:

        register.html?ref=WSABC123
      */
      const params =
        new URLSearchParams(
          window.location.search
        );

      const referralCode =
        (
          params.get("ref") ||
          ""
        ).trim();

      form.onsubmit =
        async (x) => {
          x.preventDefault();

          error.textContent = "";

          try {
            const r =
              await fetch(
                BACKEND_URL +
                  "/api/auth/register",
                {
                  method: "POST",

                  credentials:
                    "include",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify({
                      name:
                        nameInput.value.trim(),

                      email:
                        emailInput.value.trim(),

                      phone:
                        phoneInput.value.trim(),

                      password:
                        passwordInput.value,

                      /*
                        Send referral code only
                        when the visitor came
                        through a referral link.
                      */
                      ...(referralCode
                        ? {
                            referralCode:
                              referralCode
                          }
                        : {})
                    })
                }
              );

            const d =
              await r
                .json()
                .catch(
                  () => ({})
                );

            if (!r.ok) {
              throw new Error(
                d.error ||
                  "Registration failed"
              );
            }

            /*
              Registration succeeded.
              The backend will have attached
              the new account to the referrer
              when the referral code is valid.
            */
            location.href =
              "./index.html";

          } catch (q) {
            error.textContent =
              q.message ||
              "Something went wrong";
          }
        };
    </script>
  </body>
</html>
