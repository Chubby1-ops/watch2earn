<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Join Watchsave</title>
    <link rel="stylesheet" href="/public/css/style.css" />
  </head>

  <body class="auth">
    <div class="auth-card">
      <a class="logo" href="index.html">WATCH<span>SAVE</span></a>

      <div class="eyebrow">JOIN WATCHSAVE</div>

      <h1>Create your account.</h1>

      <form id="f">
        <label>
          Name
          <input id="n" required />
        </label>

        <label>
          Email
          <input id="e" type="email" required />
        </label>

        <label>
          Phone <small>(optional)</small>
          <input id="ph" />
        </label>

        <label>
          Password
          <input
            id="p"
            type="password"
            minlength="6"
            required
          />
        </label>

        <button class="primary">Create account</button>
      </form>

      <div class="switch">
        Already registered?
        <a href="login.html">Log in</a>
      </div>

      <div id="err" class="error"></div>
    </div>

    <script>
      const BACKEND_URL =
        "https://watch2earn-d9im.onrender.com";

      const form = document.getElementById("f");
      const nameInput = document.getElementById("n");
      const emailInput = document.getElementById("e");
      const phoneInput = document.getElementById("ph");
      const passwordInput = document.getElementById("p");
      const error = document.getElementById("err");

      form.onsubmit = async (x) => {
        x.preventDefault();
        error.textContent = "";

        try {
          const r = await fetch(
            BACKEND_URL + "/api/auth/register",
            {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                name: nameInput.value,
                email: emailInput.value,
                phone: phoneInput.value,
                password: passwordInput.value
              })
            }
          );

          const d = await r.json().catch(() => ({}));

          if (!r.ok) {
            throw new Error(
              d.error || "Registration failed"
            );
          }

          // Registration succeeded.
          // Send the new user to the main website.
          location.href = "./index.html";

        } catch (q) {
          error.textContent =
            q.message || "Something went wrong";
        }
      };
    </script>
  </body>
</html>
